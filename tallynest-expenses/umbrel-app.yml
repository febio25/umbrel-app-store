category: finance
name: Spese di Casa
version: "0.16.0"
tagline: Le spese di famiglia, registrate dal telefono in pochi secondi
icon: https://raw.githubusercontent.com/febio25/home-expenses/main/app/static/icons/icon-512.png
description: >-
  **Accesso:** l'app ha un proprio login, separato da quello di Umbrel. Al primo avvio chiede nome e password per le due persone di casa. Il login di Umbrel è disattivato per questa app, così chi la usa non deve conoscere la password di Umbrel.


  **Installazione sul telefono:** per installarla come app da Chrome su Android serve un indirizzo HTTPS valido. Il README del progetto spiega come ottenerlo con Tailscale Serve.


  Spese di Casa registra le spese di famiglia dal telefono: importo, esercente con suggerimenti, categoria (a icone, quattro per riga) e Salva. Data, chi ha pagato e metodo di pagamento hanno valori predefiniti e si cambiano con un tocco.


  - Lista dei movimenti per mese, con modifica ed eliminazione e ricerca in tutti i mesi; le spese già note (domiciliazioni, bollette) si inseriscono in anticipo, fino a 12 mesi, con l'etichetta «Prevista»

  - Il mese delle spese come uno scontrino, giorno per giorno con il subtotale; le entrate impaginate come una busta paga (stipendi, buoni pasto, vendite, rimborsi, regali), con la differenza tra entrate e spese

  - Sezione Vinted: un articolo per ogni cosa messa in vendita, con foto, prezzo pagato, prezzo di vendita e guadagno, gli articoli ancora da pubblicare e il riepilogo del mese con vendite e spese Vinted

  - Annunci Vinted scritti con Claude, a mano, in tre passi: l'app prepara la richiesta con i dati dell'articolo, la passa all'app Claude con la foto e legge la risposta incollata, senza collegarsi a nessun servizio

  - Riepilogo mensile con totale per categoria, dettaglio delle spese di ogni categoria, entrate per categoria e istogramma degli ultimi 6 mesi; Esplora per i totali di un mese, un anno, 6 mesi o due date a scelta

  - Spese ed entrate ricorrenti (abbonamenti, bollette, stipendi) da confermare alla scadenza

  - Export CSV di spese ed entrate per mese o intervallo, degli articoli Vinted o di tutto insieme, anche nel formato di Excel italiano, da scaricare o da condividere dal telefono con un testo che riassume i totali

  - Esercenti con ricerca e possibili doppioni da unire

  - Backup e ripristino dell'intero database dall'app, con copie automatiche giornaliere sull'Umbrel


  Nessuna chiamata esterna: niente CDN, font remoti o telemetria.
releaseNotes: >-
  Revisione grafica, senza cambiamenti al database. In Movimenti il mese è uno scontrino: una striscia sola con il bordo strappato, ogni giorno tra due tratteggi e chiuso dal suo «Subtotale»; lo stesso per le spese di una categoria e per la ricerca. Le entrate sono impaginate come una busta paga: periodo, numero di entrate e ricorrenti attese, tabella Data | Voce | Importo, totale in un riquadro e parte in buoni pasto. Le categorie delle entrate sono nell'ordine Stipendio, Buoni pasto, Vinted, Rimborsi, Regali, Vendite, Altro; Vinted ha l'etichetta della barra in basso, Vendite banconota e moneta. Nella scheda di un articolo Vinted, accanto alla foto, il titolo (fino a quattro righe, toccandolo si rinomina) e i prezzi; la matita sulla foto la cambia o la toglie; lo stato è accanto a «Su Vinted»; nei passi dell'annuncio il numero sta accanto al titolo. «Da pubblicare» ha la clessidra. Riepilogo con anello e categorie in un solo riquadro, Impostazioni in un elenco unico, promemoria delle ricorrenti in giallo chiaro, testi meno in grassetto e simbolo € più piccolo nei totali. Si può tornare alla 0.15.0 senza perdere nulla.

