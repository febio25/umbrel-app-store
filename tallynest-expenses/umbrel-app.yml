category: finance
name: Spese di Casa
version: "0.14.0"
tagline: Le spese di famiglia, registrate dal telefono in pochi secondi
icon: https://raw.githubusercontent.com/febio25/home-expenses/main/app/static/icons/icon-512.png
description: >-
  **Accesso:** l'app ha un proprio login, separato da quello di Umbrel. Al primo avvio chiede nome e password per le due persone di casa. Il login di Umbrel è disattivato per questa app, così chi la usa non deve conoscere la password di Umbrel.


  **Installazione sul telefono:** per installarla come app da Chrome su Android serve un indirizzo HTTPS valido. Il README del progetto spiega come ottenerlo con Tailscale Serve.


  Spese di Casa registra le spese di famiglia dal telefono: importo, esercente con suggerimenti, categoria e Salva. Data, chi ha pagato e metodo di pagamento hanno valori predefiniti e si cambiano con un tocco.


  - Lista dei movimenti per mese, con modifica ed eliminazione e ricerca in tutti i mesi; le spese già note (domiciliazioni, bollette) si inseriscono in anticipo, fino a 12 mesi, con l'etichetta «Prevista»

  - Entrate (stipendi, rimborsi, regali, vendite, buoni pasto) registrate a parte, con la differenza tra entrate e spese

  - Sezione Vinted: un articolo per ogni cosa messa in vendita, con foto, prezzo pagato, prezzo di vendita e guadagno, gli articoli ancora da pubblicare e il riepilogo del mese con vendite e spese Vinted

  - Annunci Vinted scritti con Claude, a mano, in tre passi: l'app prepara la richiesta con i dati dell'articolo, la passa all'app Claude con la foto e legge la risposta incollata, senza collegarsi a nessun servizio

  - Riepilogo mensile con totale per categoria, dettaglio delle spese di ogni categoria, entrate per categoria e istogramma degli ultimi 6 mesi; Esplora per i totali di un mese, un anno, 6 mesi o due date a scelta

  - Spese ed entrate ricorrenti (abbonamenti, bollette, stipendi) da confermare alla scadenza

  - Export CSV di spese ed entrate per mese o intervallo e degli articoli Vinted, anche nel formato di Excel italiano

  - Esercenti con ricerca e possibili doppioni da unire

  - Backup e ripristino dell'intero database dall'app, con copie automatiche giornaliere sull'Umbrel e l'export dei dati del mese pronti per Claude


  Nessuna chiamata esterna: niente CDN, font remoti o telemetria.
releaseNotes: >-
  L'app si apre subito, anche con Tailscale lento o spento: utenti, categorie ed esercenti restano sul telefono e l'importo si può scrivere (per salvare serve comunque la connessione). Una spesa uguale a una già registrata (stesso importo, giorno ed esercente) si salva lo stesso, ma l'avviso diventa arancione: «sembra un doppione», con il solito «Annulla». La ricerca nei Movimenti mostra 100 risultati alla volta con «Mostra altre», con i totali sempre di tutti i risultati. Nel Riepilogo del mese le entrate ricorrenti non ancora registrate compaiono come «Attese» e la Differenza le conta. In Impostazioni: ordine delle categorie modificabile, data dell'ultimo backup scaricato, copie automatiche sull'Umbrel (una al giorno e prima di aggiornamenti e ripristini) con «Ripristina», ed export «Per Claude» che scarica i CSV del periodo e copia un testo con i totali di controllo. Esercenti suggeriti in base all'uso degli ultimi 90 giorni; nel CSV «Excel italiano» le note che iniziano con - + = @ non diventano formule. Il database non cambia. Prima di aggiornare scarica un backup dall'app.

